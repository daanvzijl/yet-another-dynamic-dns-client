name: PR

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550

      - run: hk check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Build coverage report
        run: |
          set -e

          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')

          {
            echo "### Test coverage: ${total}"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } > coverage.md

          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Fork and Dependabot PRs get a read-only token, so commenting would fail.
      - name: Comment coverage on PR
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body-file coverage.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          push: false
          platforms: linux/amd64,linux/arm64
